<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔耳 Magic Ear</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cg fill='none' stroke='%23FE2C55' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M31 84C15 76 10 50 22 33 34 15 63 11 76 26 87 39 83 57 71 67'/%3E%3Ccircle cx='49' cy='49' r='10'/%3E%3Cpath d='M37 35 43 26 49 34 55 26 61 35M37 65v10h13'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FE2C55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=4.4">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-left">
      <a id="logoBtn" class="logo" title="魔耳"></a>
    </div>
    <div class="topbar-center">
      <div class="search-box">
        <span class="search-ico" id="searchIconBtn"></span>
        <input id="searchInput" placeholder="搜索视频或系列" autocomplete="off">
      </div>
    </div>
    <div class="topbar-right">
      <button class="tb-item" id="btnClient"><span class="tb-ico"></span><span class="tb-label">客户端</span></button>
      <button class="tb-item" id="btnNotify"><span class="tb-ico"></span><span class="tb-label">通知</span><i class="badge hidden" id="notifyBadge"></i></button>
      <button class="tb-item" id="btnMsg"><span class="tb-ico"></span><span class="tb-label">消息</span><i class="badge hidden" id="msgBadge"></i></button>
      <button class="tb-item avatar-item" id="btnAvatar" title="我的"></button>
    </div>
  </header>
  <div id="main">
    <nav id="sidenav">
      <div class="nav-group" id="navCats"></div>
      <div class="nav-sep"></div>
      <div class="nav-group" id="navFuncs"></div>
      <div class="nav-foot">数据仅保存在本机<br>请定期备份</div>
    </nav>
    <section id="content">
      <div id="pageHome" class="page hidden"></div>
      <div id="pageFeed" class="page">
        <div id="feedViewport">
          <div id="mobileChanTabs"></div>
          <div id="feedSlides"></div>
          <div class="feed-nav-btns">
            <button id="feedPrevBtn" title="上一个"></button>
            <button id="feedNextBtn" title="下一个"></button>
          </div>
          <aside id="commentDrawer">
            <div class="cd-head"><span class="cd-title">评论 <i id="cdCount"></i></span><button class="icon-btn" id="cdClose"></button></div>
            <div class="cd-list scrollable" id="cdList"></div>
            <div class="cd-input">
              <input id="cdText" placeholder="说点什么..." maxlength="200" autocomplete="off">
              <button class="btn-primary" id="cdSend">发送</button>
            </div>
          </aside>
          <div id="emptyFeed" class="empty hidden"></div>
        </div>
      </div>
      <div id="pageSeries" class="page hidden"></div>
      <div id="pageSearch" class="page hidden"></div>
      <div id="pageMine" class="page hidden"></div>
      <div id="pageManage" class="page hidden"></div>
      <div id="pageSubmit" class="page hidden"></div>
      <div id="pageGame" class="page hidden"></div>
      <div id="pageShop" class="page hidden"></div>
    </section>
  </div>
  <nav id="mobileTabs"></nav>
</div>
<div id="panelOverlay" class="hidden"></div>
<aside id="sidePanel" class="hidden"></aside>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
<script src="js/zip.js?v=4.4"></script>
<script src="js/db.js?v=4.4"></script>
<script src="js/ui.js?v=4.4"></script>
<script src="js/data.js?v=4.4"></script>
<script src="js/feed.js?v=4.4"></script>
<script src="js/pages.js?v=4.4"></script>
<script src="js/submit.js?v=4.4"></script>
<script src="js/cloud.js?v=4.4"></script>
<script src="js/app.js?v=4.4"></script>
</body>
</html>
